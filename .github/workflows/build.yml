name: Build Android APK
on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Publish a GitHub release with this version (e.g. 1.0.0). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Determine version
      id: version
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          version="${GITHUB_REF#refs/tags/v}"; release=true
        elif [[ -n "$INPUT_VERSION" ]]; then
          version="${INPUT_VERSION#v}"; release=true
        else
          version="0.0.0-dev.${GITHUB_RUN_NUMBER}"; release=false
        fi
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::Invalid version '$version' (expected e.g. 1.0.0)"; exit 1
        fi
        echo "name=$version" >> "$GITHUB_OUTPUT"
        echo "release=$release" >> "$GITHUB_OUTPUT"

    - name: Decode signing keystore
      if: env.KEYSTORE_BASE64 != ''
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
        echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

    - name: Build debug and release APKs
      env:
        SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        VERSION_NAME: ${{ steps.version.outputs.name }}
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug assembleRelease --stacktrace \
          -PversionName="$VERSION_NAME" \
          -PversionCode="${GITHUB_RUN_NUMBER}"
        mkdir -p dist
        cp app/build/outputs/apk/release/app-release.apk "dist/TVLauncher-${VERSION_NAME}.apk"

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: appletv-launcher-debug
        path: app/build/outputs/apk/debug/app-debug.apk
    - name: Upload release APK
      uses: actions/upload-artifact@v4
      with:
        name: appletv-launcher-release
        path: dist/*.apk

    - name: Publish GitHub release
      if: steps.version.outputs.release == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.name }}
        name: TV Launcher ${{ steps.version.outputs.name }}
        target_commitish: ${{ github.sha }}
        generate_release_notes: true
        files: dist/*.apk
